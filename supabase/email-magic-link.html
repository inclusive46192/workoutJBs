<!--
  Supabase > Authentication > Emails > "Magic Link"

  Bewusst ohne Link: die Anmeldung laeuft ausschliesslich ueber den
  sechsstelligen Code.

  Grund: ein Link wird auf dem Handy in der Mail-App angetippt und oeffnet damit
  den Standardbrowser - nicht die installierte PWA. Die Sitzung landet also im
  falschen Speicherkontext, und beim PKCE-Ablauf fehlt dort zusaetzlich der beim
  Anfordern hinterlegte Code-Verifier. Ein Code hat dieses Problem nicht: er
  wird dort eingegeben, wo er wirken soll.

  {{ .Token }} ist der Code. In der Standardvorlage kommt er nicht vor - genau
  deshalb kam bisher nur ein Link an.
-->
